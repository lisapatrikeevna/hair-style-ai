<svg width="42" height="42" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Градиент рамки зеркала -->
    <linearGradient id="gmBorderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6" /> <!-- Фиолетовый акцент -->
      <stop offset="100%" stop-color="#EC4899" /> <!-- Розовый бьюти-акцент -->
    </linearGradient>

    <!-- Мягкий фон внутри зеркала (слегка полупрозрачный, чтобы подходить любой теме) -->
    <linearGradient id="gmBgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1F2937" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>
  </defs>

  <!-- Закругленная рамка зеркала (Smart Mirror Frame) -->
  <rect x="6" y="6" width="88" height="88" rx="22" fill="url(#gmBgGrad)" stroke="url(#gmBorderGrad)" stroke-width="4" />

  <!-- Текст/Монограмма GM -->
  <text x="36" y="62" font-family="'Inter', 'Segoe UI', sans-serif" font-weight="800" font-size="34" fill="#FFFFFF" letter-spacing="-1">
    GM
  </text>

  <!-- Искорка ИИ (AI Sparkle) в верхнем правом углу зеркала -->
  <path d="M72 22L74 27L79 29L74 31L72 36L70 31L65 29L70 27L72 22Z" fill="#FDE047" />
</svg>